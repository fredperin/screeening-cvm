name: R.V. Mapp - atualizar dados e publicar site

on:
  schedule:
    - cron: "30 9 * * *"     # todo dia às 06:30 (horário de Brasília)
  workflow_dispatch:
    inputs:
      tudo:
        description: "Regerar todas as empresas (JSON + Excel)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "src/**", "config/**", ".github/workflows/rv-mapp.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rv-mapp
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # ZIPs da CVM, Parquets intermediários e arquivos já gerados do site:
      # sem isso, toda execução baixaria e regeraria tudo do zero
      - name: Restaurar cache de dados
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/pipeline
            site/dados
            site/downloads
          key: rvmapp-dados-${{ github.run_id }}
          restore-keys: rvmapp-dados-

      - name: Atualizar dados
        run: python -m pipeline.rodar ${{ inputs.tudo && '--tudo' || '' }}
        env:
          PYTHONUTF8: "1"

      # Salva logo após os dados (mesmo se a publicação abaixo falhar)
      - name: Salvar cache de dados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/pipeline
            site/dados
            site/downloads
          key: rvmapp-dados-${{ github.run_id }}

      # Versão nos arquivos do site, para o navegador não usar script antigo do cache
      - run: sed -i "s/__VERSAO__/${{ github.run_number }}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
