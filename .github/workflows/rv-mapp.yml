name: R.V. Mapp - atualizar dados e publicar site

on:
  schedule:
    - cron: "30 9 * * *"     # todo dia às 06:30 (horário de Brasília)
  workflow_dispatch:
    inputs:
      tudo:
        description: "Regerar todas as empresas (JSON + Excel)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "src/**", "config/**", ".github/workflows/rv-mapp.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: rv-mapp
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # ZIPs da CVM, Parquets intermediários e arquivos já gerados do site:
      # sem isso, toda execução baixaria e regeraria tudo do zero
      - name: Restaurar cache de dados
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/pipeline
            site/dados
            site/downloads
          key: rvmapp-dados-${{ github.run_id }}
          restore-keys: rvmapp-dados-

      - name: Atualizar dados
        run: python -m pipeline.rodar ${{ inputs.tudo && '--tudo' || '' }}
        env:
          PYTHONUTF8: "1"
          # chaves gratuitas cadastradas pelo usuário em Settings → Secrets → Actions (vazias = fonte desligada)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

      # Agentes automáticos (sem IA): saúde das fontes e anomalias nos dados gerados
      - name: Monitorar fontes
        if: always()
        continue-on-error: true
        run: python -m pipeline.monitor
        env:
          PYTHONUTF8: "1"

      - name: Validar dados
        if: always()
        continue-on-error: true
        run: python -m pipeline.validar
        env:
          PYTHONUTF8: "1"

      # Última barreira: nenhuma chave de acesso pode ir para o site nem para o alerta (algumas APIs repetem a chave no erro)
      - name: Ocultar chaves de acesso
        if: always()
        run: python -m pipeline.limpar_segredos
        env:
          PYTHONUTF8: "1"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      # Problema -> abre (ou comenta) uma issue com o rótulo rv-mapp-alerta, que chega por e-mail.
      # Tudo normal -> fecha a issue aberta, se houver.
      - name: Alerta no GitHub
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aberta=$(gh issue list --label rv-mapp-alerta --state open --json number -q '.[0].number' || true)
          if [ -f data/pipeline/alerta.md ]; then
            gh label create rv-mapp-alerta --color B60205 --description "Falha detectada pelo monitor da R.V. Mapp" --force
            if [ -n "$aberta" ]; then
              gh issue comment "$aberta" --body-file data/pipeline/alerta.md
            else
              gh issue create --title "R.V. Mapp: problema nas fontes de dados ($(date +%d/%m/%Y))"                 --label rv-mapp-alerta --body-file data/pipeline/alerta.md
            fi
          elif [ -n "$aberta" ]; then
            gh issue close "$aberta" --comment "Fontes e dados voltaram ao normal em $(date +%d/%m/%Y)."
          fi

      # Salva logo após os dados (mesmo se a publicação abaixo falhar)
      - name: Salvar cache de dados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/pipeline
            site/dados
            site/downloads
          key: rvmapp-dados-${{ github.run_id }}

      # Versão nos arquivos do site, para o navegador não usar script antigo do cache
      - run: sed -i "s/__VERSAO__/${{ github.run_number }}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
